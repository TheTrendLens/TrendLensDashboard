<div class="py-10">
  <header>
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold leading-tight tracking-tight text-gray-900">Account Settings</h1>
    </div>
  </header>
  <main>
    <div class="mx-auto max-w-7xl sm:px-6 lg:px-8">
      <div class="px-4 py-8 sm:px-0">
        <div class="mb-8">
          <h2 class="text-lg font-medium text-gray-900">Account Information</h2>
          <div class="mt-4 bg-white px-6 py-5 shadow sm:rounded-lg sm:px-8">
            <div class="border-b border-gray-200 pb-5">
              <dl class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-2">
                <div class="sm:col-span-1">
                  <dt class="text-sm font-medium text-gray-500">Email</dt>
                  <dd class="mt-1 text-sm text-gray-900">{{ userEmail }}</dd>
                </div>
              </dl>
            </div>
          </div>
        </div>

        <div class="mb-8">
          <h2 class="text-lg font-medium text-gray-900">Security</h2>
          <div class="mt-4">
            <app-change-password></app-change-password>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
