<div class="py-10">
  <header>
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <h1 class="text-3xl font-bold leading-tight tracking-tight text-gray-900">Account Settings</h1>
    </div>
  </header>
  <main>
    <div class="mx-auto max-w-7xl sm:px-6 lg:px-8">
      <div class="px-4 py-8 sm:px-0">
        <div class="mb-8">
          <h2 class="text-lg font-medium text-gray-900">Account Information</h2>
          <div class="mt-4 bg-white px-6 py-5 shadow sm:rounded-lg sm:px-8">
            <div class="border-b border-gray-200 pb-5">
              <dl class="grid grid-cols-1 gap-x-4 gap-y-6 sm:grid-cols-2">
                <div class="sm:col-span-1">
                  <dt class="text-sm font-medium text-gray-500">Email</dt>
                  <dd class="mt-1 text-sm text-gray-900">{{ userEmail }}</dd>
                </div>
                <div class="sm:col-span-1">
                  <dt class="text-sm font-medium text-gray-500">Currency</dt>
                  <dd class="mt-1 text-sm text-gray-900">
                    <div class="flex items-center space-x-2">
                      <select
                        [(ngModel)]="selectedCurrency"
                        class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-red-600 sm:max-w-xs sm:text-sm sm:leading-6"
                      >
                        <option *ngFor="let option of currencyService.currencyOptions" [value]="option.code">
                          {{ option.name }}
                        </option>
                      </select>
                      <button
                        type="button"
                        (click)="updateCurrency()"
                        [disabled]="isCurrencyUpdating"
                        class="inline-flex items-center rounded-md bg-red-500 px-2.5 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-red-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500">
                        <svg *ngIf="isCurrencyUpdating" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        {{ isCurrencyUpdating ? 'Updating...' : 'Update' }}
                      </button>
                    </div>
                  </dd>
                </div>
                <div class="sm:col-span-1">
                  <dt class="text-sm font-medium text-gray-500">Theme</dt>
                  <dd class="mt-1 text-sm text-gray-900">
                    <div class="flex items-center space-x-2">
                      <button
                        type="button"
                        (click)="toggleDarkMode()"
                        class="inline-flex items-center rounded-md bg-red-500 px-2.5 py-1.5 text-sm font-semibold text-white shadow-sm hover:bg-red-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500">
                        <svg *ngIf="!isDarkMode" class="-ml-0.5 mr-1.5 h-5 w-5 text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                          <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                        </svg>
                        <svg *ngIf="isDarkMode" class="-ml-0.5 mr-1.5 h-5 w-5 text-white" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                        </svg>
                        {{ isDarkMode ? 'Dark Mode' : 'Light Mode' }}
                      </button>
                    </div>
                  </dd>
                </div>
              </dl>
            </div>
          </div>
        </div>

        <div class="mb-8">
          <h2 class="text-lg font-medium text-gray-900">Billing & Subscription</h2>
          <div class="mt-4 bg-white px-6 py-5 shadow sm:rounded-lg sm:px-8">
            <p class="text-sm text-gray-500 mb-4">
              Manage your subscription, update payment methods, or view your billing history.
            </p>
            <button
              type="button"
              (click)="goToStripeBillingPortal()"
              [disabled]="isLoading"
              class="inline-flex items-center rounded-md bg-red-500 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500">
              <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <svg *ngIf="!isLoading" class="-ml-0.5 mr-1.5 h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M2.5 4A1.5 1.5 0 001 5.5V6h18v-.5A1.5 1.5 0 0017.5 4h-15zM19 8.5H1v6A1.5 1.5 0 002.5 16h15a1.5 1.5 0 001.5-1.5v-6zM3 10h.01v1H3v-1zm2 0h.01v1H5v-1zm2 0h.01v1H7v-1zm2 0h.01v1H9v-1zm2 0h.01v1h-.01v-1zm2 0h.01v1h-.01v-1zm2 0h.01v1h-.01v-1z" clip-rule="evenodd" />
              </svg>
              {{ isLoading ? 'Loading...' : 'Manage Billing & Subscription' }}
            </button>
          </div>
        </div>

        <div class="mb-8">
          <h2 class="text-lg font-medium text-gray-900">Security</h2>
          <div class="mt-4">
            <app-change-password></app-change-password>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
