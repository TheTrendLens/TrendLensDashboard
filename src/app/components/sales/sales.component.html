<!-- Search, Filter, and Sort Controls -->
<div class="mb-6 bg-white rounded-lg shadow p-4">
  <!-- Header with Search and Create Button -->
  <div class="flex justify-between items-center mb-4">
    <!-- Search Bar -->
    <div class="relative flex-grow mr-4">
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
        <mat-icon class="text-gray-400">search</mat-icon>
      </div>
      <input
        type="text"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full pl-10 p-2.5"
        placeholder="Search by buyer name, date, etc."
        [(ngModel)]="searchQuery"
        (keyup.enter)="onSearch(searchQuery)">
    </div>

    <!-- Create Sale Button - Only shown if experimental features are enabled -->
    <button
      *ngIf="experimentalFeaturesEnabled"
      (click)="createSale()"
      class="px-4 py-2 bg-brand-500 text-white rounded-lg hover:bg-brand-600 transition flex items-center">
      <mat-icon class="mr-1">add</mat-icon>
      Create Sale
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <!-- Date Filter -->
    <div>
      <label for="dateFilter" class="block mb-2 text-sm font-medium text-gray-900">Date Range</label>
      <select
        id="dateFilter"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5"
        [(ngModel)]="dateFilter"
        (change)="applyFilters()">
        <option value="all">All Time</option>
        <option value="today">Today</option>
        <option value="week">This Week</option>
        <option value="month">This Month</option>
        <option value="year">This Year</option>
      </select>
    </div>

    <!-- Sort By -->
    <div>
      <label for="sortBy" class="block mb-2 text-sm font-medium text-gray-900">Sort By</label>
      <select
        id="sortBy"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5"
        [(ngModel)]="sortBy"
        (change)="applyFilters()">
        <option value="date_desc">Date (Newest First)</option>
        <option value="date_asc">Date (Oldest First)</option>
        <option value="total_desc">Revenue (High to Low)</option>
        <option value="total_asc">Revenue (Low to High)</option>
        <option value="buyer_asc">Buyer Name (A-Z)</option>
        <option value="buyer_desc">Buyer Name (Z-A)</option>
      </select>
    </div>

    <!-- Items Filter -->
    <div>
      <label for="itemsFilter" class="block mb-2 text-sm font-medium text-gray-900">Items Count</label>
      <select
        id="itemsFilter"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full p-2.5"
        [(ngModel)]="itemsFilter"
        (change)="applyFilters()">
        <option value="all">All</option>
        <option value="single">Single Item</option>
        <option value="multiple">Multiple Items</option>
      </select>
    </div>

    <!-- Missing Costs Filter -->
    <div>
      <label for="missingCosts" class="block mb-2 text-sm font-medium text-gray-900">Missing Costs</label>
      <div class="flex items-center">
        <input
          id="missingCosts"
          type="checkbox"
          class="w-4 h-4 text-brand-600 bg-gray-100 border-gray-300 rounded focus:ring-brand-500"
          [(ngModel)]="missingCosts"
          (change)="applyFilters()">
        <label for="missingCosts" class="ml-2 text-sm font-medium text-gray-900">Show sales with missing costs</label>
      </div>
    </div>
  </div>
</div>

<!-- Pagination Arrows -->
<div class="flex justify-between items-center mb-6">
  <div class="text-sm text-gray-700">
    Showing <span class="font-medium">{{ (currentPage - 1) * pageSize + 1 }}</span> to
    <span class="font-medium">{{ Math.min(currentPage * pageSize, totalRows) }}</span> of
    <span class="font-medium">{{ totalRows }}</span> sales
  </div>
</div>

<!-- Card Grid with Restructured Cards -->
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 3xl:grid-cols-8 gap-4 w-full">
  <!-- Sale Card Component -->
  <app-sale-card
    *ngFor="let sale of salesData"
    [sale]="sale"
    [itemCount]="saleItemCounts[sale.id]"
    (cardClick)="navigateToBundle($event)">
  </app-sale-card>
</div>

<!-- Pagination Arrows Above Cards -->
<div class="flex justify-center mb-6 space-x-4">
  <button
    mat-icon-button
    [disabled]="currentPage === 1"
    (click)="goToPreviousPage()"
    class="flex items-center justify-center"
    aria-label="Previous page">
    <mat-icon class="flex items-center justify-center">arrow_back</mat-icon>
  </button>
  <button
    mat-icon-button
    [disabled]="currentPage >= totalPages"
    (click)="goToNextPage()"
    class="flex items-center justify-center"
    aria-label="Next page">
    <mat-icon class="flex items-center justify-center">arrow_forward</mat-icon>
  </button>
</div>
