<div class="container mx-auto px-4 py-8 max-w-md">
  <div class="bg-white rounded-lg shadow-md p-6">
    <h1 class="text-2xl font-bold mb-4 text-center">
      <ng-container *ngIf="mode === 'resetPassword' && !isSuccess">Reset Your Password</ng-container>
      <ng-container *ngIf="mode === 'verifyEmail' && !isSuccess">Email Verification</ng-container>
      <ng-container *ngIf="isSuccess">Success</ng-container>
    </h1>

    <!-- Loading/Verifying State -->
    <div *ngIf="isVerifying" class="text-center py-4">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
      <p>Verifying your request...</p>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="bg-blue-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
      <p>{{ errorMessage }}</p>
    </div>

    <!-- Success Message -->
    <div *ngIf="isSuccess" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
      <p>{{ successMessage }}</p>
      <div class="mt-4 text-center">
        <button (click)="backToLogin()" class="flex w-full justify-center rounded-md bg-blue-500 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-sm hover:bg-blue-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500">
          Go to Login
        </button>
      </div>
    </div>

    <!-- Password Reset Form -->
    <form *ngIf="mode === 'resetPassword' && !isVerifying && !isSuccess" [formGroup]="passwordForm" (ngSubmit)="resetPassword()">
      <div class="mb-4">
        <label for="password" class="block text-gray-700 text-sm font-bold mb-2">New Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          [ngClass]="{'border-red-500': password?.invalid && (password?.dirty || password?.touched)}"
        >
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="text-red-500 text-xs mt-1">
          <div *ngIf="password?.errors?.['required']">Password is required.</div>
          <div *ngIf="password?.errors?.['weakPassword']">
            Password must be at least 8 characters long and include uppercase, lowercase, and numbers.
          </div>
        </div>
      </div>

      <div class="mb-6">
        <label for="confirmPassword" class="block text-gray-700 text-sm font-bold mb-2">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
          [ngClass]="{'border-red-500': confirmPassword?.invalid && (confirmPassword?.dirty || confirmPassword?.touched) || !passwordsMatch}"
        >
        <div *ngIf="confirmPassword?.invalid && (confirmPassword?.dirty || confirmPassword?.touched)" class="text-red-500 text-xs mt-1">
          <div *ngIf="confirmPassword?.errors?.['required']">Please confirm your password.</div>
        </div>
        <div *ngIf="!passwordsMatch && confirmPassword?.dirty" class="text-red-500 text-xs mt-1">
          Passwords do not match.
        </div>
      </div>

      <div class="flex items-center justify-between">
        <button
          type="submit"
          [disabled]="passwordForm.invalid || isLoading"
          class="flex w-full justify-center rounded-md bg-blue-500 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-sm hover:bg-blue-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500"
          [ngClass]="{'opacity-50 cursor-not-allowed': passwordForm.invalid || isLoading}"
        >
          <span *ngIf="isLoading" class="inline-block animate-spin mr-2">⟳</span>
          Reset Password
        </button>
      </div>
    </form>
  </div>
</div>
