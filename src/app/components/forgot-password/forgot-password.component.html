<!-- forgot-password.component.html -->
<div class="container mx-auto px-4 h-full">
  <div class="flex content-center items-center justify-center h-full">
    <div class="w-full lg:w-4/12 px-4">
      <div class="relative flex flex-col min-w-0 break-words w-full mb-6 shadow-lg rounded-lg bg-gray-200 border-0">
        <div class="rounded-t mb-0 px-6 py-6">
          <div class="text-center mb-3">
            <h6 class="text-gray-600 text-sm font-bold">Forgot Password</h6>
          </div>
          <hr class="mt-6 border-b-1 border-gray-400" />
        </div>
        <div class="flex-auto px-4 lg:px-10 py-10 pt-0">
          <div *ngIf="!isSubmitted; else successMessage">
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
              <div class="relative w-full mb-3">
                <label class="block uppercase text-gray-700 text-xs font-bold mb-2" for="email">
                  Email
                </label>
                <input
                  type="email"
                  id="email"
                  formControlName="email"
                  class="border-0 px-3 py-3 placeholder-gray-400 text-gray-700 bg-white rounded text-sm shadow focus:outline-none focus:ring w-full"
                  placeholder="Email"
                  style="transition: all 0.15s ease 0s;"
                />
              </div>

              <div class="text-red-500 text-xs mt-1 mb-3" *ngIf="errorMessage">
                {{ errorMessage }}
              </div>

              <div class="text-center mt-6">
                <button
                  class="bg-gray-900 text-white active:bg-gray-700 text-sm font-bold uppercase px-6 py-3 rounded shadow hover:shadow-lg outline-none focus:outline-none mr-1 mb-1 w-full"
                  type="submit"
                  style="transition: all 0.15s ease 0s;"
                >
                  Reset Password
                </button>
              </div>
            </form>

            <div class="w-full text-center mt-4">
              <button
                class="text-gray-600 hover:text-gray-800 text-sm font-bold"
                (click)="backToLogin()"
              >
                Back to Login
              </button>
            </div>
          </div>

          <ng-template #successMessage>
            <div class="text-center py-4">
              <p class="text-gray-700 mb-4">
                If an account exists with the email you provided, we've sent a password reset link.
              </p>
              <p class="text-gray-700 mb-4">
                Please check your email and follow the instructions to reset your password.
              </p>
              <button
                class="bg-gray-900 text-white active:bg-gray-700 text-sm font-bold uppercase px-6 py-3 rounded shadow hover:shadow-lg outline-none focus:outline-none mr-1 mb-1"
                (click)="backToLogin()"
                style="transition: all 0.15s ease 0s;"
              >
                Return to Login
              </button>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
