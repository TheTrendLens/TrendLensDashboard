<ag-grid-angular
  class="ag-theme-quartz"
  style="height: 500px;"
  [rowData]="rowData"
  [columnDefs]="colDefs">
</ag-grid-angular>
<ng-container *ngIf="user$ | async as user">
  <div class="profile-grid">
    <div class="profile__header">
      <img [src]="user.picture" alt="Profile" class="profile__avatar" />
      <div class="profile__headline">
        <h2 class="profile__title">{{ user.name }}</h2>
        <span class="profile__description">{{ user.email }}</span>
        <span class="profile__description">{{ user }}</span>
      </div>
    </div>
    <ng-container *ngIf="code$ | async as code">
      <div class="profile__details">
        <span class="profile__description">{{ code }}</span>
      </div>
    </ng-container>
  </div>
</ng-container>
