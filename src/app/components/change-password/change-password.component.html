<div class="bg-white px-6 py-8 shadow sm:rounded-lg sm:px-8">
  <h2 class="text-xl font-semibold text-gray-900 mb-6">Change Password</h2>

  <!-- Error message display -->
  <div *ngIf="errorMessage" class="rounded-md bg-red-50 p-4 mb-4">
    <div class="flex">
      <div class="flex-shrink-0">
        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="ml-3">
        <h3 class="text-sm font-medium text-red-800">{{ errorMessage }}</h3>
      </div>
    </div>
  </div>

  <!-- Success message -->
  <div *ngIf="successMessage" class="rounded-md bg-green-50 p-4 mb-4">
    <div class="flex">
      <div class="flex-shrink-0">
        <svg class="h-5 w-5 text-green-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
        </svg>
      </div>
      <div class="ml-3">
        <h3 class="text-sm font-medium text-green-800">{{ successMessage }}</h3>
      </div>
    </div>
  </div>

  <form class="space-y-6" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div>
      <label for="currentPassword" class="block text-sm/6 font-medium text-gray-900">Current Password</label>
      <div class="mt-2">
        <input type="password" name="currentPassword" id="currentPassword" formControlName="currentPassword" autocomplete="current-password" required class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-red-500 sm:text-sm/6" [ngClass]="{'outline-red-500': currentPassword?.invalid && (currentPassword?.dirty || currentPassword?.touched)}">
      </div>
      <div *ngIf="currentPassword?.invalid && (currentPassword?.dirty || currentPassword?.touched)" class="mt-1 text-sm text-red-600">
        <div *ngIf="currentPassword?.errors?.['required']">Current password is required.</div>
      </div>
    </div>

    <div>
      <label for="newPassword" class="block text-sm/6 font-medium text-gray-900">New Password</label>
      <div class="mt-2">
        <input type="password" name="newPassword" id="newPassword" formControlName="newPassword" autocomplete="new-password" required class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-red-500 sm:text-sm/6" [ngClass]="{'outline-red-500': newPassword?.invalid && (newPassword?.dirty || newPassword?.touched)}">
      </div>
      <div *ngIf="newPassword?.invalid && (newPassword?.dirty || newPassword?.touched)" class="mt-1 text-sm text-red-600">
        <div *ngIf="newPassword?.errors?.['required']">New password is required.</div>
        <div *ngIf="newPassword?.errors?.['weakPassword']">Password must be at least 8 characters and include uppercase, lowercase, and numbers.</div>
      </div>
    </div>

    <div>
      <label for="confirmPassword" class="block text-sm/6 font-medium text-gray-900">Confirm Password</label>
      <div class="mt-2">
        <input type="password" name="confirmPassword" id="confirmPassword" formControlName="confirmPassword" autocomplete="new-password" required class="block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline focus:outline-2 focus:-outline-offset-2 focus:outline-red-500 sm:text-sm/6" [ngClass]="{'outline-red-500': !passwordsMatch && (confirmPassword?.dirty || confirmPassword?.touched)}">
      </div>
      <div *ngIf="!passwordsMatch && (confirmPassword?.dirty || confirmPassword?.touched)" class="mt-1 text-sm text-red-600">
        Passwords do not match.
      </div>
    </div>

    <div>
      <button type="submit" [disabled]="!form.valid || isLoading" class="flex w-full justify-center rounded-md bg-red-500 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-sm hover:bg-red-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-500">
        <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Change Password
      </button>
    </div>
  </form>
</div>
