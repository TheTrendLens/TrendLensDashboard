<!-- src/app/components/sales-upload/sales-upload.component.html -->
<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-6">Sales Upload</h1>

  <!-- Upload Section -->
  <div class="bg-white rounded-lg shadow p-6 mb-8">
    <h2 class="text-xl font-semibold mb-4">Upload Sales CSV</h2>

    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Select CSV File</label>
      <input
        type="file"
        accept=".csv"
        (change)="onFileSelected($event)"
        class="block w-full text-sm text-gray-500
               file:mr-4 file:py-2 file:px-4
               file:rounded-md file:border-0
               file:text-sm file:font-semibold
               file:bg-brand-50 file:text-brand-700
               hover:file:bg-brand-100"
      >
    </div>

    <button
      (click)="uploadFile()"
      [disabled]="isUploading || !selectedFile"
      class="px-4 py-2 bg-brand-600 text-white rounded-lg hover:bg-brand-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <span *ngIf="!isUploading">Upload File</span>
      <span *ngIf="isUploading">Uploading... {{ uploadProgress }}%</span>
    </button>
  </div>

  <!-- Previous Imports Section -->
  <div class="bg-white rounded-lg shadow p-6">
    <h2 class="text-xl font-semibold mb-4">Previous Imports</h2>

    <div *ngIf="imports.length === 0" class="text-gray-500 italic">
      No previous imports found.
    </div>

    <div class="overflow-x-auto">
      <table *ngIf="imports.length > 0" class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
        <tr>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Filename</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sales</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Listings</th>
          <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let importRecord of imports">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">{{ importRecord.filename }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ importRecord.created_at | date:'longDate' }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ importRecord.sales_created }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ importRecord.listings_created }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <button
              (click)="deleteImport(importRecord.id)"
              class="text-red-600 hover:text-red-900"
            >
              Delete
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
