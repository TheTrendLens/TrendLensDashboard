<h2 mat-dialog-title class="text-xl text-brand-500 font-semibold pb-2 border-b border-gray-100">Upload CSV File</h2>
<mat-dialog-content class="mt-4">
  <form [formGroup]="uploadForm">
    <div class="grid grid-cols-1 gap-4">
      <!-- File selection area with improved touch interface -->
      <div
        class="bg-gray-50 border rounded-lg p-4 transition-colors"
        [ngClass]="{
          'border-brand-400 bg-brand-50': isDragging,
          'border-gray-300 hover:border-brand-400': !isDragging
        }"
      >
        <div class="flex flex-col items-center justify-center cursor-pointer" (click)="fileInput.click()">
          <!-- File icon -->
          <svg xmlns="http://www.w3.org/2000/svg"
            [ngClass]="{'text-brand-400': isDragging, 'text-gray-400': !isDragging}"
            class="h-12 w-12 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>

          <!-- File selection text -->
          <p class="text-sm mb-1" [ngClass]="{'text-brand-500 font-medium': isDragging, 'text-gray-500': !isDragging}">
            {{ isDragging ? 'Drop CSV file here' : 'Click to select a CSV file' }}
          </p>
          <p class="text-xs text-gray-400" *ngIf="!isDragging">or drag and drop file here</p>
        </div>
      </div>

      <!-- Hidden file input -->
      <input type="file" hidden #fileInput accept=".csv" (change)="onFileSelected($event)">

      <!-- Selected file info with improved styling -->
      <div *ngIf="selectedFileName" class="bg-white rounded-lg shadow p-4 border-l-4 border-brand-400">
        <div class="flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-brand-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <div>
            <p class="text-sm font-medium text-gray-900">{{ selectedFileName }}</p>
            <p class="text-xs text-gray-500">Ready to upload</p>
          </div>
        </div>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end" class="mt-4 pt-2 border-t border-gray-100">
  <button mat-button class="text-gray-500 hover:text-gray-700 px-4 py-2 rounded-lg" (click)="onCancel()">Cancel</button>
  <button
    mat-button
    class="bg-brand-400 text-white px-4 py-2 rounded-lg hover:bg-brand-500 disabled:bg-gray-300 disabled:text-gray-500"
    [disabled]="!selectedFile || uploadInProgress"
    (click)="onUpload()">
    <span *ngIf="!uploadInProgress" class="flex items-center">
      <svg *ngIf="!uploadInProgress" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
      </svg>
      Upload
    </span>
    <span *ngIf="uploadInProgress" class="flex items-center">
      <svg class="animate-spin h-5 w-5 mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      Uploading...
    </span>
  </button>
</mat-dialog-actions>
